name: Сборка и деплой

on:
  schedule:
    # Слоты по МСК: 02, 06, 10, 14, 18, 22 (= UTC 23, 3, 7, 11, 15, 19).
    # Расписание ненадёжное — GitHub может задержать или пропустить запуск.
    # Страхует watchdog.yml: он проверяет свежесть и перезапускает сборку.
    - cron: '0 3,7,11,15,19,23 * * *'
  push:
    branches: [main]
    # Сборка сама коммитит обновлённый накопитель в data/. Такой коммит
    # не должен запускать новый прогон — иначе получится бесконечный цикл.
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Тесты
        run: python -m unittest discover -s tests -t .

      - name: Сбор новостей и сайта
        run: python collect.py

      # Накопитель живёт в data/ и хранится в репозитории — это архив проекта.
      # Без этого шага новые новости остались бы только в артефакте сборки.
      - name: Сохранение накопителя в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "накопитель не изменился — коммит не нужен"
          else
            git commit -m "данные: сборка $(date -u '+%Y-%m-%d %H:%M') UTC [skip ci]"
            git push
          fi

      # Основной сайт теперь живёт по адресу /news-agregator/. Этот репозиторий
      # остаётся источником кода, но его Pages служит только редиректом —
      # иначе в сети было бы два одинаковых сайта.
      - name: Редирект на основной адрес
        run: |
          mkdir -p docs
          cat > docs/index.html <<'HTML'
          <!doctype html>
          <html lang="ru">
          <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=https://dmserge77.github.io/news-agregator/">
          <link rel="canonical" href="https://dmserge77.github.io/news-agregator/">
          <title>Нейрорадар — переезд на основной адрес</title>
          <script>location.replace('https://dmserge77.github.io/news-agregator/');</script>
          </head>
          <body><a href="https://dmserge77.github.io/news-agregator/">Перейти на Нейрорадар</a></body>
          </html>
          HTML
          cp docs/index.html docs/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
