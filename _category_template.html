*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background-color:var(--bg);background-image:var(--ornament);background-repeat:repeat;background-attachment:fixed;color:var(--text);line-height:1.5;padding:20px}
.container{max-width:1100px;margin:0 auto;background:var(--bg)}
header{text-align:center;padding:30px 0 10px}
header h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#0071e3,#5856d6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);font-size:1rem;margin-top:4px}
.nav-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0 10px}
.nav-btn{padding:8px 18px;border-radius:20px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);text-decoration:none;font-size:.85rem;transition:all .2s}
.nav-btn:hover{border-color:var(--accent);color:var(--accent)}
.nav-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.cat-title{text-align:center;font-size:1.3rem;font-weight:600;margin:20px 0 16px}
.lang-bar,.sub-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.lang-bar.hidden,.sub-bar.hidden{display:none}
.lang-btn{padding:6px 18px;border-radius:20px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);cursor:pointer;font-size:.85rem;transition:all .2s}
.lang-btn:hover{border-color:var(--accent);color:var(--accent)}
.lang-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.news-feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:12px;margin-top:16px}
/* Одна карточка = одна дата. Высота фиксированная, список внутри прокручивается:
   в день бывает и одна новость, и десять, а размеры карточек должны совпадать. */
.day-card{height:360px;background:var(--card-bg);border:1.5px solid var(--border);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
/* Самый свежий день — акцентный блок: на широком экране занимает две ячейки.
   Ниже 700 px сетка одноколоночная, поэтому span сбрасывается. */
@media (min-width:700px){.day-card--lead{grid-column:span 2}}
/* Цвет рубрики — полоска сверху и мягкая подложка. Как на главной: готовый
   светлый оттенок не задаём, rgba поверх фона работает в обеих темах. */
.day-card{position:relative;background:linear-gradient(150deg,rgba(var(--accent-rgb),.13),rgba(var(--accent-rgb),0) 62%),var(--card-bg)}
.day-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),rgba(var(--accent-rgb),0));pointer-events:none}
/* Дни с одной-двумя новостями центрируются по вертикали, чтобы пустое место
   внутри карточки не выглядело как обрыв списка. */
.day-list--short{justify-content:center}
.day-head{flex:0 0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
.day-date{font-size:1rem;font-weight:600}
.day-count{font-size:.75rem;color:var(--text2);white-space:nowrap}
.day-list{flex:1 1 auto;min-height:0;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin}
.news-row{padding:8px 6px;border-bottom:1px solid var(--border);border-radius:8px;cursor:pointer;animation:fadeIn .3s ease}
.news-row:last-child{border-bottom:none}
.news-row:hover{background:rgba(127,127,127,.08)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.row-title{font-size:.9rem;font-weight:600;line-height:1.4}
.row-src{font-size:.75rem;color:var(--text2);margin-top:2px}
.row-src a{color:var(--accent);text-decoration:none;font-weight:500}
.row-src a:hover{text-decoration:underline}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;justify-content:center;align-items:center;padding:20px}
.overlay.open{display:flex}
.modal{background:var(--card-bg);border-radius:16px;max-width:620px;width:100%;max-height:85vh;overflow-y:auto;padding:28px 24px;box-shadow:0 16px 48px rgba(0,0,0,.25)}
.modal .close{float:right;font-size:1.8rem;cursor:pointer;color:var(--text2);border:none;background:0;padding:0 4px}
.modal .close:hover{color:var(--text)}
.modal .m-date{font-size:.8rem;color:var(--text2);margin-bottom:8px}
.modal .m-title{font-size:1.3rem;font-weight:700;line-height:1.4;margin-bottom:16px;padding-right:24px}
.modal .m-body{font-size:.95rem;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.modal .m-footer{margin-top:20px;padding-top:16px;border-top:1px solid var(--border);font-size:.85rem;color:var(--text2)}
.modal .m-footer a{color:var(--accent);text-decoration:none;font-weight:500}
.modal .m-footer a:hover{text-decoration:underline}
.empty-state{text-align:center;padding:60px 20px;color:var(--text2);grid-column:1/-1}
.empty-state .emoji{font-size:3rem;margin-bottom:16px}
footer{text-align:center;padding:40px 0 20px;color:var(--text2);font-size:.85rem}
</style>

<script>
var raw = window.NEWS_DATA || {};
var items = Array.isArray(raw) ? raw : (raw.items || []);
var buildTime = raw.updated || new Date().toLocaleString('ru-RU', {timeZone:'Europe/Moscow'});
var activeLang = 'ru', activeSub = 'all';

function sortByDate(arr) { return arr.sort(function(a,b){return (b.date||'').localeCompare(a.date||'')}); }

// 2026-09-14 -> 14.09.2026
function fmtDate(s) {
  if (!s) return '';
  var p = String(s).split('-');
  return (p.length === 3) ? (p[2] + '.' + p[1] + '.' + p[0]) : s;
}

// Заголовки, названия источников и ссылки приходят из чужих лент.
// Карточки собираются строкой и вставляются через innerHTML, поэтому
// любой текст обязан пройти через esc(): иначе тег из чужой ленты
// выполнится в браузере посетителя как разметка и код.
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Ссылка идёт в href. Адрес вида javascript: выполнится по клику,
// поэтому пропускаем только http и https, остальное ведёт в никуда.
// Пробел, кавычка и угловые скобки в адресе — попытка вылезти из атрибута,
// такие тоже отбрасываем: экранирование рядом есть, но пусть будет два замка.
function safeUrl(u) {
  var s = String(u === null || u === undefined ? '' : u).trim();
  if (/[\s"'<>\\]/.test(s)) return '#';
  return /^https?:\/\//i.test(s) ? s : '#';
}

function getFiltered() {
  var arr = sortByDate(items.slice());
  if (activeLang !== 'all') arr = arr.filter(function(n){ return n.lang === activeLang; });
  if (activeSub !== 'all') arr = arr.filter(function(n){ return (n.job_type||n.order_type||n.misc_type) === activeSub; });
  return arr;
}

// Одна карточка на дату. Размер карточек одинаковый; новости дня лежат
// внутри прокручиваемого списка, чтобы день с 10 записями не растягивал сетку.
function render() {
  var grid = document.getElementById('newsGrid');
  var arr = getFiltered();
  if (arr.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="emoji">📭</div><p>Новостей пока нет</p></div>';
    return;
  }
  var groups = [], lastDate = null;
  for (var i = 0; i < arr.length; i++) {
    var n = arr[i];
    if (n.date !== lastDate) {
      groups.push({date: n.date, items: []});
      lastDate = n.date;
    }
    groups[groups.length - 1].items.push({n: n, idx: i});
  }
  var html = '';
  for (var g = 0; g < groups.length; g++) {
    var day = groups[g];
    var count = day.items.length;
    var label = count + ' ' + (count === 1 ? 'новость' :
      (count > 1 && count < 5 ? 'новости' : 'новостей'));
    html += '<div class="' + (g === 0 ? 'day-card day-card--lead' : 'day-card') +
      '"><div class="day-head"><span class="day-date">' +
      esc(fmtDate(day.date)) + '</span><span class="day-count">' + label +
      '</span></div><div class="day-list' + (count <= 2 ? ' day-list--short' : '') + '">';
    for (var j = 0; j < count; j++) {
      var item = day.items[j], n = item.n;
      html += '<div class="news-row" data-idx="' + item.idx + '"><div class="row-title">' +
        esc(n.title) + '</div><div class="row-src"><a href="' +
        esc(safeUrl(n.link)) + '" target="_blank" rel="noopener">' +
        esc(n.source) + '</a></div></div>';
    }
    html += '</div></div>';
  }
  grid.innerHTML = html;
}

// Клик по строке внутри карточки дня — открыть модальное окно.
document.getElementById('newsGrid').addEventListener('click', function(e) {
  var card = e.target.closest('.news-row');
  if (!card) return;
  if (e.target.tagName === 'A') return;
  var idx = parseInt(card.getAttribute('data-idx'));
  var arr = getFiltered();
  var n = arr[idx];
  if (!n) return;
  document.getElementById('mDate').textContent = fmtDate(n.date);
  document.getElementById('mTitle').textContent = n.title;
  document.getElementById('mBody').textContent = n.desc || n.title;
  var src = document.getElementById('mSource');
  src.textContent = n.source;
    src.href = safeUrl(n.link);
    src.target = "_blank";
    src.rel = "noopener";
  document.getElementById('overlay').className = 'overlay open';
});

function closeModal() { document.getElementById('overlay').className = 'overlay'; }

// Lang filter
document.getElementById('langBar').addEventListener('click', function(e) {
  var btn = e.target.closest('.lang-btn');
  if (!btn) return;
  document.querySelectorAll('#langBar .lang-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  activeLang = btn.getAttribute('data-lang');
  render();
});

// Sub filters (jobs/orders/misc)
var hasJobType = items.some(function(n){ return n.job_type; });
var hasOrderType = items.some(function(n){ return n.order_type; });
var hasMiscType = items.some(function(n){ return n.misc_type; });
if (hasJobType) document.getElementById('jobBar').className = 'sub-bar';
if (hasOrderType) document.getElementById('orderBar').className = 'sub-bar';
if (hasMiscType) document.getElementById('miscBar').className = 'sub-bar';
[document.getElementById('jobBar'), document.getElementById('orderBar'), document.getElementById('miscBar')].forEach(function(bar) {
  if (!bar) return;
  bar.addEventListener('click', function(e) {
    var btn = e.target.closest('.lang-btn');
    if (!btn) return;
    bar.querySelectorAll('.lang-btn').forEach(function(b){b.classList.remove('active')});
    btn.classList.add('active');
    activeSub = btn.getAttribute('data-sub');
    render();
  });
});

document.getElementById('lastUpdated').textContent = 'Обновлено: ' + buildTime + ' (МСК)';
document.getElementById('overlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });
render();
</script>
</body>
</html>
